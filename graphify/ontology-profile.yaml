id: proofline-studio
version: 1
default_language: en

node_types:
  StudioProject:
    aliases: [project, client_project, landing_project]
    source_backed: true
    status_policy: operational
  DiscoveryBrief:
    aliases: [brief, client_discovery, discovery]
    source_backed: true
    status_policy: human_review
  MessageMap:
    aliases: [copy_map, message_architecture, positioning]
    source_backed: true
    status_policy: human_review
  CreativeDirection:
    aliases: [direction, visual_direction, design_system]
    source_backed: true
    status_policy: human_review
  ProofAsset:
    aliases: [proof, testimonial, logo, case_study, asset]
    source_backed: true
    status_policy: evidence_required
  QAReview:
    aliases: [qa, quality_assurance, launch_review]
    source_backed: true
    status_policy: human_review
  GateDecision:
    aliases: [gate, signoff, human_gate]
    source_backed: true
    status_policy: human_review
  Standard:
    aliases: [quality_standard, accessibility, performance, compliance]
    source_backed: true
    status_policy: reference
  Offer:
    aliases: [package, service, sprint]
    source_backed: true
    status_policy: reference
  Task:
    aliases: [task, work_item, job]
    source_backed: true
    status_policy: operational
  Pattern:
    aliases: [design_pattern, conversion_pattern, cookbook_pattern]
    source_backed: true
    status_policy: evidence_required
  AntiPattern:
    aliases: [anti_pattern, failure_mode, launch_blocker]
    source_backed: true
    status_policy: evidence_required
  Experiment:
    aliases: [test, validation_experiment, pattern_test]
    source_backed: true
    status_policy: human_review
  BusinessArchetype:
    aliases: [archetype, conversion_blueprint, business_system]
    source_backed: true
    status_policy: evidence_required
  ArchetypeAssessment:
    aliases: [archetype_fit, client_archetype, selection_assessment]
    source_backed: true
    status_policy: human_review
  Prospect:
    aliases: [lead, outbound_candidate, prospect_record]
    source_backed: true
    status_policy: evidence_required
  Signal:
    aliases: [trigger, buying_signal, public_signal]
    source_backed: true
    status_policy: evidence_required
  Audit:
    aliases: [teardown, prospect_audit, conversion_audit]
    source_backed: true
    status_policy: human_review
  OutreachDraft:
    aliases: [email_draft, personalized_outreach, message_draft]
    source_backed: true
    status_policy: human_review
  SendApproval:
    aliases: [send_gate, outbound_approval, exact_message_approval]
    source_backed: true
    status_policy: human_review
  ReplyRecord:
    aliases: [reply, response, suppression_event]
    source_backed: true
    status_policy: operational
  SuppressionRecord:
    aliases: [suppression, opt_out_record, do_not_contact]
    source_backed: true
    status_policy: operational
  SourcePolicy:
    aliases: [source_admissibility, prospecting_policy, data_source_policy]
    source_backed: true
    status_policy: reference
  QualityRun:
    aliases: [qa_run, quality_audit, evidence_run]
    source_backed: true
    status_policy: evidence_required
  LayaRequest:
    aliases: [advisory_request, model_request, routing_request]
    source_backed: true
    status_policy: operational
  LayaDecision:
    aliases: [advisory_decision, model_recommendation, triage_recommendation]
    source_backed: true
    status_policy: human_review
  LayaEvaluation:
    aliases: [model_evaluation, calibration_label, human_label]
    source_backed: true
    status_policy: human_review

relation_types:
  has_discovery:
    source_types: [StudioProject]
    target_types: [DiscoveryBrief]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  freezes:
    source_types: [MessageMap, GateDecision]
    target_types: [StudioProject, CreativeDirection]
    requires_evidence: true
    assertion_basis: [EXTRACTED, INFERRED]
    derivation_methods: [human_action, reviewed_synthesis]
  uses_direction:
    source_types: [StudioProject]
    target_types: [CreativeDirection]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  supported_by:
    source_types: [StudioProject, MessageMap]
    target_types: [ProofAsset]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  governed_by:
    source_types: [StudioProject, CreativeDirection, QAReview]
    target_types: [Standard]
    requires_evidence: true
    assertion_basis: [EXTRACTED, INFERRED]
    derivation_methods: [policy_match, reviewed_synthesis]
  reviewed_by:
    source_types: [StudioProject]
    target_types: [QAReview, GateDecision]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [human_action]
  packages_as:
    source_types: [StudioProject]
    target_types: [Offer]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  tested_by:
    source_types: [Pattern, AntiPattern]
    target_types: [Experiment]
    requires_evidence: true
    assertion_basis: [EXTRACTED, INFERRED]
    derivation_methods: [source_citation, reviewed_synthesis]
  replaces:
    source_types: [AntiPattern]
    target_types: [Pattern]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  fits_archetype:
    source_types: [StudioProject]
    target_types: [BusinessArchetype]
    requires_evidence: true
    assertion_basis: [EXTRACTED, INFERRED]
    derivation_methods: [human_action, reviewed_synthesis]
  assesses:
    source_types: [ArchetypeAssessment]
    target_types: [StudioProject]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  recommends:
    source_types: [ArchetypeAssessment]
    target_types: [BusinessArchetype]
    requires_evidence: true
    assertion_basis: [EXTRACTED, INFERRED]
    derivation_methods: [reviewed_synthesis]
  has_signal:
    source_types: [Prospect]
    target_types: [Signal]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  has_audit:
    source_types: [Prospect]
    target_types: [Audit]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  has_outreach_draft:
    source_types: [Prospect]
    target_types: [OutreachDraft]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  gated_by:
    source_types: [OutreachDraft]
    target_types: [SendApproval]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [human_action]
  has_reply:
    source_types: [Prospect]
    target_types: [ReplyRecord]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  suppresses:
    source_types: [Prospect, ReplyRecord]
    target_types: [SuppressionRecord]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [human_action, source_citation]
  governed_by_source_policy:
    source_types: [Prospect, OutreachDraft, SendApproval]
    target_types: [SourcePolicy]
    requires_evidence: true
    assertion_basis: [EXTRACTED, INFERRED]
    derivation_methods: [policy_match, source_citation]
  has_quality_run:
    source_types: [StudioProject, QAReview]
    target_types: [QualityRun]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  produces_advisory:
    source_types: [LayaRequest]
    target_types: [LayaDecision]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [source_citation]
  evaluated_by:
    source_types: [LayaDecision]
    target_types: [LayaEvaluation]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [human_action]
  advises:
    source_types: [LayaDecision]
    target_types: [Prospect, ArchetypeAssessment, ReplyRecord, QAReview, Task]
    requires_evidence: true
    assertion_basis: [EXTRACTED]
    derivation_methods: [reviewed_synthesis]

hardening:
  statuses: [candidate, proposed, needs_review, validated, reference, rejected, superseded]
  default_status: candidate
  promotion_requires: [evidence_refs, human_review]

inference_policy:
  allow_inferred_relations: true
  allowed_relation_types: [freezes, governed_by, fits_archetype, recommends]
  require_evidence_refs: true

evidence_policy:
  require_evidence_refs: true
  min_refs: 1
  node_types: [StudioProject, DiscoveryBrief, MessageMap, CreativeDirection, ProofAsset, QAReview, GateDecision, Standard, Offer, Pattern, AntiPattern, Experiment, BusinessArchetype, ArchetypeAssessment, Prospect, Signal, Audit, OutreachDraft, SendApproval, ReplyRecord, SuppressionRecord, SourcePolicy, QualityRun, LayaRequest, LayaDecision, LayaEvaluation]
  relation_types: [has_discovery, freezes, uses_direction, supported_by, governed_by, reviewed_by, packages_as, tested_by, replaces, fits_archetype, assesses, recommends, has_signal, has_audit, has_outreach_draft, gated_by, has_reply, suppresses, governed_by_source_policy, has_quality_run, produces_advisory, evaluated_by, advises]

outputs:
  ontology:
    enabled: true
    canonical_node_types: [StudioProject, DiscoveryBrief, MessageMap, CreativeDirection, ProofAsset, QAReview, GateDecision, Standard, Offer, Pattern, AntiPattern, Experiment, BusinessArchetype, ArchetypeAssessment, Prospect, Signal, Audit, OutreachDraft, SendApproval, ReplyRecord, LayaRequest, LayaDecision, LayaEvaluation, Task]
    source_node_types: [ProofAsset, QAReview, GateDecision, Pattern, AntiPattern, Experiment, BusinessArchetype, ArchetypeAssessment, Prospect, Signal, Audit, OutreachDraft, SendApproval, ReplyRecord, LayaRequest, LayaDecision, LayaEvaluation]
    occurrence_node_types: []
    alias_fields: [aliases, normalized_terms]
    relation_exports: [has_discovery, freezes, uses_direction, supported_by, governed_by, reviewed_by, packages_as, tested_by, replaces, fits_archetype, assesses, recommends, has_signal, has_audit, has_outreach_draft, gated_by, has_reply, produces_advisory, evaluated_by, advises]
    wiki:
      enabled: false
